<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Template Ruang Objek WebAR - Hiro Marker</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* Reset & Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3. DESAIN UI WATERMARK & KUSTOMISASI */
        /* Watermark Identitas (Pojok Kiri Atas) */
        .watermark-container {
            position: absolute;
            top: 16px;
            left: 16px;
            min-width: 220px;
            z-index: 999;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            pointer-events: none; /* Agar tidak mengganggu interaksi sentuhan */
        }

        .watermark-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 6px;
        }

        .watermark-text {
            display: flex;
            flex-direction: column;
        }

        .watermark-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin: 0;
            text-transform: uppercase;
        }

        .watermark-subtitle {
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            margin: 2px 0 0 0;
        }

        /* Tombol UI (Pojok Kanan Bawah) */
        .ui-btn-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: none; /* Tersembunyi secara default */
            transition: all 0.3s ease;
        }

        .info-btn {
            background: #0ea5e9;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-radius: 50px; /* Pill-shaped */
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.5), 0 8px 10px -6px rgba(14, 165, 233, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-btn:active {
            transform: scale(0.95);
            background: #0284c7;
        }

        /* Modal Box / Info Box (Tengah Layar) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.4);
            display: none; /* Tersembunyi secara default */
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: modalFadeIn 0.3s ease forwards;
            color: #f8fafc;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 8px;
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .close-btn {
            background: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .close-btn:active {
            background: #dc2626;
        }

        /* Memastikan kamera AR berada di layer paling belakang */
        .a-canvas {
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="watermark-container">
        <img src="logo-watermark.png" alt="Logo" class="watermark-logo" onerror="this.style.display='none'">
        <div class="watermark-text">
            <h1 class="watermark-title">TUGAS AKHIR</h1>
            <span class="watermark-subtitle">AFRA NAORA JANNAH / PGSD</span>
        </div>
    </div>

    <div class="ui-btn-container" id="uiBtnContainer">
        <button class="info-btn" id="openModalBtn">BACA INFO OBJEK</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 class="modal-title">Informasi Objek</h2>
            <div class="modal-body">
                <p>Selamat datang di Ruang Objek AR. Ini adalah area placeholder teks deskripsi. Anda dapat mengisi bagian ini dengan penjelasan detail mengenai asal-usul, fungsi, maupun informasi ilmiah terkait objek 3D yang sedang ditampilkan di atas marker.</p>
            </div>
            <button class="close-btn" id="closeModalBtn">Tutup</button>
        </div>
    </div>


    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true;">
        
        <a-assets>
            <a-asset-item id="model-utama" src="soekarno.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="hiroMarker">
            
            <a-entity id="rotationContainer" rotation="0 0 0">
                <a-entity 
                    gltf-model="#model-utama"
                    position="0 0.9 0"
                    scale="5 5 5">
                </a-entity>
            </a-entity>

            <a-text 
                value="NAMA OBJEK" 
                color="#38bdf8" 
                align="center" 
                position="0 2.2 0" 
                scale="1.2 1.2 1.2"
                font="https://cdn.aframe.io/fonts/DejaVu-sans.fnt">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <script>
        // Deklarasi DOM Elements
        const marker = document.getElementById('hiroMarker');
        const uiBtnContainer = document.getElementById('uiBtnContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const rotationContainer = document.getElementById('rotationContainer');

        // --- A. EVENT LISTENER MARKER (FOUND / LOST) ---
        marker.addEventListener('markerFound', () => {
            uiBtnContainer.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
            // Sembunyikan Tombol dan Modal secara otomatis jika penanda hilang
            uiBtnContainer.style.display = 'none';
            modalOverlay.style.display = 'none';
            // Reset rotasi objek ke posisi awal saat hilang dari pandangan
            rotationContainer.setAttribute('rotation', '0 0 0');
        });

        // --- B. TOGGLE MODAL BOX / INFO BOX ---
        openModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        // Menutup modal jika pengguna tidak sengaja mengeklik area overlay hitam di luar kotak modal
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });


        // --- C. LOGIKA ROTASI MANUAL (DRAG/TOUCH) KUNCI SUMBU Y ---
        let isDragging = false;
        let previousPointerPositionX = 0;
        const rotationSpeed = 0.4; // Sensitivitas putaran objek

        // Handler saat pointer mulai menyentuh/klik layar
        function onPointerDown(e) {
            // Jangan jalankan rotasi jika pengguna sedang mengeklik UI (Tombol/Modal)
            if (e.target.closest('.watermark-container') || e.target.closest('#uiBtnContainer') || e.target.closest('#modalOverlay')) {
                return;
            }
            isDragging = true;
            // Mendukung event Mouse (clientX) maupun Touchscreen (touches[0].clientX)
            previousPointerPositionX = e.clientX || (e.touches && e.touches[0].clientX);
        }

        // Handler saat pointer digeser/drag
        function onPointerMove(e) {
            if (!isDragging) return;

            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            const deltaX = currentX - previousPointerPositionX;

            // Ambil data rotasi saat ini
            let currentRotation = rotationContainer.getAttribute('rotation');

            // Hitung nilai rotasi baru hanya untuk sumbu Y (Horizontal)
            let newRotationY = currentRotation.y + deltaX * rotationSpeed;

            // LOGIKA DIKUNCI: Sumbu X dan Z dipaksa tetap berada di angka 0 agar tidak miring
            rotationContainer.setAttribute('rotation', {
                x: 0,
                y: newRotationY,
                z: 0
            });

            previousPointerPositionX = currentX;
        }

        // Handler saat sentuhan/klik dilepas
        function onPointerUp() {
            isDragging = false;
        }

        // Memasang Event Listener ke Window untuk menangkap interaksi Desktop & Mobile
        // Desktop (Mouse)
        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        // Mobile (Touch/Layar Sentuh)
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
    </script>
</body>
</html>
